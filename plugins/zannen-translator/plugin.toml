id = "zannen.translator"
name = "Zannen Live Translate"
version = "0.5.0"
api = 1
description = "Live speech translation: microphone input → speech-to-text (STT) → target-language translation, with a floating overlay window"
icon = "languages"
capabilities = ["audio"]

[backend]
name = "zannen_translator"

[frontend]
entry = "frontend/dist/index.js"
css = "frontend/dist/style.css"

[[routes]]
path = "translator"
title = "Live Translate"
icon = "languages"
